        - Programas
      summary: Editar programa
      description: 'Para dar de baja enviar `{ "estado": "B" }`. Se permite aunque tenga viajes.'
      operationId: updatePrograma
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramaUpdate"
      responses:
        "200":
          description: Programa actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Programa"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /tipos-programas:
    get:
      tags:
        - Tipos de programas
      summary: Listar tipos de programa
      operationId: getTiposProgramas
      responses:
        "200":
          description: Lista de tipos de programa
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TipoPrograma"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # =========================
  # Instituciones
  # =========================
  /instituciones:
    get:
      tags:
        - Instituciones
      summary: Listar instituciones
      operationId: getInstituciones
      parameters:
        - in: query
          name: search
          required: false
          description: Busca por nombre
          schema:
            type: string
        - $ref: "#/components/parameters/IncluirBajas"
      responses:
        "200":
          description: Lista de instituciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Institucion"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - Instituciones
      summary: Crear institución
      description: La institución se crea con estado A.
      operationId: createInstitucion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstitucionInput"
      responses:
        "201":
          description: Institución creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Institucion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /instituciones/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags:
        - Instituciones
      summary: Obtener institución con país, provincia y ciudad
      operationId: getInstitucionById
      responses:
        "200":
          description: Detalle de la institución
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitucionDetalle"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags:
        - Instituciones
      summary: Editar institución
      description: 'Para dar de baja enviar `{ "estado": "B" }`. Se permite aunque tenga pasajeros.'
      operationId: updateInstitucion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstitucionUpdate"
      responses:
        "200":
          description: Institución actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Institucion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /instituciones/{id}/pasajeros:
    get:
      tags:
        - Instituciones
      summary: Listar los pasajeros de la institución
      description: Sin alergia ni dieta.
      operationId: getPasajerosInstitucion
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IncluirBajas"
      responses:
        "200":
          description: Pasajeros de la institución
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pasajero"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # =========================
  # Vuelos
  # =========================
  /vuelos:
    get:
      tags:
        - Vuelos
      summary: Listar vuelos (paginado, ordenado por fecha)
      description: Los próximos vuelos se piden con `?desde=<hoy>`.
      operationId: getVuelos
      parameters:
        - in: query
          name: desde
          required: false
          schema:
            type: string
            format: date-time
          example: "2026-10-26"
        - in: query
          name: hasta
          required: false
          schema:
            type: string
            format: date-time
        - in: query
          name: idAeropuerto
          required: false
          description: Aeropuerto de origen o de destino
          schema:
            type: integer
        - in: query
          name: numeroVuelo
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Página de vuelos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VuelosPaginados"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - Vuelos
      summary: Crear vuelo
      operationId: createVuelo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VueloInput"
      responses:
        "201":
          description: Vuelo creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vuelo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
